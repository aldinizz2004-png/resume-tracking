<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProGineer Resume Tracking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-name">Resume Tracking</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="brand-team">ProGineer Technologies</span>
        <button type="button" id="addCandidateButton" class="btn btn-primary btn-sm">+ Add candidate</button>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <section class="summary" aria-label="Pipeline summary">
      <div class="metric"><span class="metric-value" id="statTotal">0</span><span class="metric-label">Candidates</span></div>
      <div class="metric metric-open"><span class="metric-value" id="statOpen">0</span><span class="metric-label">Awaiting review</span></div>
      <div class="metric metric-interview"><span class="metric-value" id="statInterviews">0</span><span class="metric-label">In interview</span></div>
      <div class="metric metric-accepted"><span class="metric-value" id="statAccepted">0</span><span class="metric-label">Accepted</span></div>
    </section>

    <div class="row g-4">
      <div class="col-xl-8">
        <section class="panel" aria-labelledby="listTitle">
          <div class="panel-head">
            <h2 id="listTitle" class="panel-title">Candidates</h2>
            <span id="resultCount" class="panel-count" aria-live="polite"></span>
          </div>

          <div class="toolbar">
            <div class="search">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/></svg>
              <input type="search" id="searchInput" class="form-control" placeholder="Search by name" aria-label="Search candidates by name" autocomplete="off">
            </div>
            <select id="positionFilter" class="form-select" aria-label="Filter by position"></select>
            <select id="statusFilter" class="form-select" aria-label="Filter by status"></select>
            <select id="sortSelect" class="form-select" aria-label="Sort by application date">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
            <button type="button" id="resetFilters" class="btn-soft">Reset</button>
          </div>

          <div class="table-wrap">
            <table class="table candidates-table align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Candidate</th>
                  <th scope="col">Contact</th>
                  <th scope="col">Position</th>
                  <th scope="col">Applied</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="text-end"><span class="visually-hidden">Actions</span></th>
                </tr>
              </thead>
              <tbody id="candidateBody"></tbody>
            </table>
          </div>
          <nav id="pager" class="pager" aria-label="Candidates pages" hidden></nav>
        </section>
      </div>

      <div class="col-xl-4">
        <section class="panel panel-sticky" aria-labelledby="detailsTitle">
          <div class="panel-head"><h2 id="detailsTitle" class="panel-title">Application details</h2></div>
          <div id="details" class="panel-body" aria-live="polite"></div>
        </section>
      </div>
    </div>

    <section class="panel mt-4" aria-labelledby="formTitle">
      <div class="panel-head"><h2 id="formTitle" class="panel-title">Add candidate</h2></div>
      <form id="candidateForm" class="panel-body" novalidate>
        <div class="row g-3">
          <div class="col-md-6 col-xl-4">
            <label for="fullName" class="form-label">Full name</label>
            <input type="text" id="fullName" class="form-control" autocomplete="off" aria-describedby="fullNameError">
            <div id="fullNameError" class="field-error" role="alert"></div>
          </div>
          <div class="col-md-6 col-xl-4">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" autocomplete="off" aria-describedby="emailError">
            <div id="emailError" class="field-error" role="alert"></div>
          </div>
          <div class="col-md-6 col-xl-4">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" id="phone" class="form-control" autocomplete="off" aria-describedby="phoneError">
            <div id="phoneError" class="field-error" role="alert"></div>
          </div>
          <div class="col-md-6 col-xl-4">
            <label for="position" class="form-label">Applied position</label>
            <select id="position" class="form-select" aria-describedby="positionError"></select>
            <div id="positionError" class="field-error" role="alert"></div>
          </div>
          <div class="col-md-6 col-xl-4">
            <label for="appliedAt" class="form-label">Application date</label>
            <input type="date" id="appliedAt" class="form-control" aria-describedby="appliedAtError">
            <div id="appliedAtError" class="field-error" role="alert"></div>
          </div>
          <div class="col-md-12 col-xl-4">
            <label for="notes" class="form-label">Notes <span class="optional">optional</span></label>
            <textarea id="notes" class="form-control" rows="1" maxlength="200"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submitButton" class="btn btn-primary">Add candidate</button>
          <button type="button" id="cancelEdit" class="btn-soft d-none">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <div id="messages" class="toast-area"></div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
